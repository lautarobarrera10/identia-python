[project]
name = "identia-python"
version = "0.1.0"
description = "Proyecto en Python para trabajar con Identia"
readme = "README.md"
authors = [
    { name = "Lautaro Barrera", email = "lautarobarrera12@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
]

[project.scripts]
identia-python = "identia_python:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
